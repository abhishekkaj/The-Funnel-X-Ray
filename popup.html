<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Funnel X-Ray</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <h1>The Funnel <span>X-Ray</span> <span id="pro-badge" style="display: none;" class="pro-badge">👑 PRO</span></h1>
        <div class="status-indicator"></div>
    </div>

    <!-- Skeleton Loader State -->
    <div id="loading-state" class="state-container active">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-title mt-4"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-title mt-4"></div>
        <div class="skeleton skeleton-text"></div>
    </div>

    <!-- Finalized Data View State -->
    <div id="data-state" class="state-container">

        <!-- Full Page Capture Controls -->
        <div id="capture-controls" style="margin-bottom: 20px; text-align: center;">
            <button id="capture-btn" class="btn"
                style="background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); width: 100%;">
                📸 Capture Full Page
            </button>

            <div id="capturing-state"
                style="display: none; padding: 12px; background: var(--surface-light); border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); font-weight: 500; animation: pulse 2s infinite;">
                📸 Capturing... Please wait...
            </div>
        </div>

        <!-- Meta Ad Library Radar -->
        <div style="margin-bottom: 20px; text-align: center;">
            <a id="ad-radar-btn" href="#" target="_blank" class="btn"
                style="background: linear-gradient(135deg, #4f46e5, #4338ca); position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);">
                <span class="pulse-dot"></span>
                👁️ View Active Meta Ads
            </a>
        </div>

        <!-- Tech Stack Profiler Accordion -->
        <div class="accordion" style="border-color: #6366f1;">
            <button class="accordion-header" aria-expanded="false" style="color: #a5b4fc;">
                <span class="icon">🔌</span> Tech Stack Profiler
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="detected-tech-data" class="data-group" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
        </div>

        <!-- VSL & Video Assets Accordion -->
        <div class="accordion" style="border-color: #f59e0b;">
            <button class="accordion-header" aria-expanded="false" style="color: #fbbf24;">
                <span class="icon">🎬</span> VSL & Video Assets
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="vsl-data" class="data-group"></div>
            </div>
        </div>

        <!-- Lead-Gen Forms Accordion -->
        <div class="accordion" style="border-color: #10b981;">
            <button class="accordion-header" aria-expanded="false" style="color: #34d399;">
                <span class="icon">🎣</span> Lead-Gen Forms
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="forms-data" class="data-group"></div>
            </div>
        </div>

        <!-- Copy Psychology Accordion -->
        <div class="accordion" style="border-color: #ec4899;">
            <button class="accordion-header" aria-expanded="false" style="color: #f472b6;">
                <span class="icon">🧠</span> Copy Psychology
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="psychology-data" class="data-group"></div>
            </div>
        </div>

        <!-- Elite Recon (Hidden Data) Accordion -->
        <div class="accordion" style="border-color: #f43f5e; box-shadow: 0 0 10px rgba(244, 63, 94, 0.1);">
            <button class="accordion-header" aria-expanded="false" style="color: #fb7185;">
                <span class="icon">🕵️‍♂️</span> Elite Recon (Hidden Data)
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="elite-recon-data" class="data-group"></div>
            </div>
        </div>

        <!-- Hidden Funnel Steps Accordion (Freemium) -->
        <div class="accordion" style="border-color: var(--accent);">
            <button class="accordion-header" aria-expanded="false" style="color: var(--accent);">
                <span class="icon">🕵️</span> Hidden Funnel Steps
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="funnel-data" class="data-group relative-container"></div>
            </div>
        </div>

        <!-- Architecture Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">🏗️</span> Architecture (WP)
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="wp-data" class="data-group"></div>
            </div>
        </div>

        <!-- SEO X-Ray Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">🔍</span> SEO X-Ray
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="seo-data" class="data-group"></div>
            </div>
        </div>

        <!-- Page Skeleton (SEO) Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">🦴</span> Page Skeleton (SEO)
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="skeleton-data" class="data-group"></div>
            </div>
        </div>

        <!-- Brand & Design System Accordion -->
        <div class="accordion" style="border-color: #8b5cf6;">
            <button class="accordion-header" aria-expanded="false" style="color: #a78bfa;">
                <span class="icon">🎨</span> Brand & Design System
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="design-data" class="data-group"></div>
            </div>
        </div>

        <!-- E-Commerce Stack Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">🛒</span> E-Commerce Stack
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="ecommerce-data" class="data-group"></div>
            </div>
        </div>

        <!-- On-Page Products Accordion -->
        <div class="accordion">
            <button id="product-accordion-btn" class="accordion-header" aria-expanded="false">
                <span class="icon">🛍️</span> Products on Page
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="on-page-products-data" class="data-group"></div>
            </div>
        </div>

        <!-- Omnichannel Pixels Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">📢</span> Omnichannel Pixels
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="omnichannel-data" class="data-group"></div>
            </div>
        </div>

        <!-- Lead Magnets & Assets Accordion -->
        <div class="accordion">
            <button class="accordion-header" aria-expanded="false">
                <span class="icon">🧲</span> Lead Magnets & Assets
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div id="assets-data" class="data-group"></div>
            </div>
        </div>

        <!-- Vault Export Button (for data) -->
        <div style="margin-top: 24px; text-align: center;">
            <button id="export-btn" class="btn btn-export">
                📥 Export Swipe File (<span id="export-count">0</span>/3 free)
            </button>
            <p id="export-status" style="display: none; font-size: 0.75rem; margin-top: 8px;"></p>
        </div>
    </div>

    <!-- Paywall Screen (Hidden by Default) -->
    <div id="paywall-screen" style="display: none;">
        <div class="paywall-container">
            <div class="paywall-icon">🛑</div>
            <h2 class="paywall-title">Free Trial Exhausted</h2>
            <p class="paywall-subtitle">You've used your 3 free exports! Upgrade to PRO for a one-time fee of <strong>$10</strong> to unlock unlimited lifetime exports and Elite Recon data.</p>
            
            <button id="upgrade-btn" class="btn paywall-cta">🛒 Upgrade to PRO ($10)</button>

            <div class="paywall-divider">
                <span>or activate your license</span>
            </div>

            <input type="text" id="license-key-input" class="paywall-input" placeholder="Paste your Gumroad License Key here...">
            <button id="activate-btn" class="btn paywall-activate">🔓 Unlock PRO</button>
            <p id="activation-msg" class="paywall-msg" style="display: none;"></p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
